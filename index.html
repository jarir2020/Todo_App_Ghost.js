<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Ghost.js</title>
    <style>
/* Reset and base styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app-container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

/* Header */
.todo-header {
    text-align: center;
    margin-bottom: 30px;
    color: white;
}

.todo-header h1 {
    font-size: 48px;
    font-weight: 300;
    margin-bottom: 8px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
}

.subtitle {
    font-size: 14px;
    opacity: 0.9;
    font-weight: 300;
}

/* Main todo app container */
.todo-app {
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    overflow: hidden;
}

/* Input section */
.todo-input-container {
    display: flex;
    padding: 16px;
    border-bottom: 1px solid #e0e0e0;
    gap: 8px;
}

.todo-input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
}

.todo-input:focus {
    border-color: #667eea;
}

.add-button {
    padding: 12px 24px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}

.add-button:hover {
    background: #5568d3;
}

.add-button:active {
    transform: scale(0.98);
}

/* Todo list */
.todo-list {
    list-style: none;
    max-height: 400px;
    overflow-y: auto;
}

.todo-item {
    display: flex;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.2s;
    gap: 12px;
}

.todo-item:hover {
    background: #f8f9fa;
}

.todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #999;
}

.todo-checkbox {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #667eea;
}

.todo-text {
    flex: 1;
    font-size: 16px;
    color: #333;
    word-break: break-word;
}

.delete-button {
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    color: #999;
    font-size: 28px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

.delete-button:hover {
    background: #fee;
    color: #e53e3e;
}

.empty-state {
    padding: 40px;
    text-align: center;
    color: #999;
    font-style: italic;
}

/* Footer */
.todo-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #f8f9fa;
    border-top: 1px solid #e0e0e0;
    font-size: 14px;
    flex-wrap: wrap;
    gap: 12px;
}

.todo-count {
    color: #666;
}

.filters {
    display: flex;
    gap: 4px;
}

.filter-button {
    padding: 6px 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    color: #666;
    font-size: 14px;
    transition: all 0.2s;
}

.filter-button:hover {
    border-color: #667eea;
}

.filter-button.active {
    border-color: #667eea;
    color: #667eea;
    background: rgba(102, 126, 234, 0.1);
}

.clear-completed {
    padding: 6px 12px;
    background: transparent;
    border: none;
    color: #666;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s;
}

.clear-completed:hover {
    color: #e53e3e;
    background: rgba(229, 62, 62, 0.1);
}

/* Responsive design */
@media (max-width: 640px) {
    body {
        padding: 12px;
    }

    .todo-header h1 {
        font-size: 36px;
    }

    .todo-input-container {
        flex-direction: column;
    }

    .add-button {
        width: 100%;
    }

    .todo-footer {
        flex-direction: column;
        align-items: flex-start;
    }

    .filters {
        order: -1;
    }
}

/* Scrollbar styling */
.todo-list::-webkit-scrollbar {
    width: 8px;
}

.todo-list::-webkit-scrollbar-track {
    background: #f1f1f1;
}

.todo-list::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 4px;
}

.todo-list::-webkit-scrollbar-thumb:hover {
    background: #999;
}
    </style>
</head>
<body>
    <script src="bundle.js"></script>
</body>
</html>
